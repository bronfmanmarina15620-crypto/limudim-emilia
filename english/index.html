<!DOCTYPE html>
<html lang="he" dir="rtl">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="theme-color" content="#fdf7f2">
<title>אנגלית של אמיליה</title>
<link rel="icon" href="../assets/favicon.png">
<link rel="apple-touch-icon" href="../assets/apple-touch-icon.png">
<link href="https://fonts.googleapis.com/css2?family=Heebo:wght@400;500;700;800&display=swap" rel="stylesheet">
<style>
:root{--bg:#fdf7f2;--card:#fff;--ink:#33303c;--muted:#8a8496;--pink:#ff7aa8;--pink-d:#e85f8e;--mint:#2fbf9b;--sky:#5aa9f7;--sun:#ffc75a;--bad:#ef5f6b;--line:#efe7e0;--violet:#8b7cf6;--shadow:0 8px 24px rgba(80,40,60,.08);--radius:22px}
*{box-sizing:border-box;-webkit-tap-highlight-color:transparent}
html,body{margin:0;padding:0;background:var(--bg);color:var(--ink);font-family:"Heebo",system-ui,-apple-system,"Segoe UI",sans-serif;direction:rtl;text-align:right}
body{padding:14px 16px 48px;max-width:460px;margin:0 auto}
button,input{font-family:inherit}
.hidden{display:none!important}
a.limudim-back{display:block;text-align:center;text-decoration:none;font-weight:800;font-size:16px;color:#fff;background:linear-gradient(135deg,#8b7cf6,#ff7aa8);border-radius:18px;padding:12px 14px;margin:0 0 12px;box-shadow:0 4px 12px rgba(120,90,200,.25)}
.hero{display:flex;align-items:center;gap:10px;margin:4px 0 6px}
.hero h1{margin:0;font-size:22px;font-weight:800}
.hero .flag{font-size:34px}
.sub{color:var(--pink-d);font-weight:700;font-size:14px;margin:2px 0 0}
.meta{display:flex;justify-content:space-between;color:var(--muted);font-size:12px;font-weight:600;margin:4px 2px 10px}
.card,.panel{background:var(--card);border-radius:var(--radius);box-shadow:var(--shadow);padding:14px 16px;margin:10px 0}
.panel h3{margin:0 0 8px;font-size:16px}
.big-btns{display:grid;grid-template-columns:1fr 1fr;gap:10px;margin:10px 0}
.act{border:0;border-radius:20px;padding:14px 12px;color:#fff;text-align:right;cursor:pointer;box-shadow:var(--shadow)}
.act b{display:block;font-size:17px}.act p{margin:4px 0 0;font-size:12px;opacity:.95}
.act.violet{background:linear-gradient(135deg,#8b7cf6,#a99bff)}.act.pink{background:linear-gradient(135deg,#ff7aa8,#ff9fbf)}
.act.wide{grid-column:1/-1;background:#fff;color:var(--ink);border:2px solid var(--line)}
.resume{display:block;width:100%;border:0;border-radius:18px;background:var(--sun);color:#4a3a10;padding:12px 14px;text-align:right;cursor:pointer;margin:8px 0}
.resume b{font-size:16px}.resume p{margin:2px 0 0;font-size:12px}
.gh{font-size:16px;margin:18px 2px 8px}
.grid{display:grid;grid-template-columns:1fr 1fr;gap:10px}
.topic{background:#fff;border:0;border-radius:18px;box-shadow:var(--shadow);padding:12px;text-align:right;cursor:pointer;display:flex;flex-direction:column;gap:4px;min-height:96px}
.topic .ti{font-size:24px}.topic b{font-size:14px;line-height:1.3}
.tag{display:inline-block;align-self:flex-start;font-size:11px;font-weight:700;border-radius:999px;padding:2px 8px;background:#f1edf9;color:#6a5bd6}
.tag.good{background:#dff6ef;color:#1f8f73}.tag.warn{background:#ffe7ec;color:#c9405f}
.topbar{display:flex;align-items:center;justify-content:space-between;gap:8px;margin-bottom:6px}
.topbar h2{margin:0;font-size:17px}
.ghost{background:#fff;border:1px solid var(--line);color:var(--muted);border-radius:999px;padding:8px 14px;font-size:14px;font-weight:700;cursor:pointer}
.bar{height:8px;background:#efe7f6;border-radius:99px;overflow:hidden;margin:6px 0 4px}.bar i{display:block;height:100%;background:linear-gradient(90deg,#8b7cf6,#ff7aa8);width:0;transition:width .3s}
.count{font-size:12px;color:var(--muted);font-weight:700}
.section{background:#efeaff;color:#5b4cc4;font-weight:800;font-size:13px;border-radius:12px;padding:6px 10px;margin-bottom:8px}
.tagline{font-size:12px;color:var(--pink-d);font-weight:700;margin-bottom:4px}
.prompt{font-size:17px;font-weight:700;margin:4px 0 10px;line-height:1.4}
.stim{background:#fff;border-radius:18px;box-shadow:var(--shadow);padding:16px;font-size:22px;font-weight:700;text-align:left;line-height:1.45;margin:8px 0}
.stim.he{text-align:center;direction:rtl;color:var(--pink-d)}
.passage{background:#fffdf6;border:2px solid #f6e7b8;border-radius:16px;padding:10px 12px;margin:8px 0}
.passage summary{cursor:pointer;font-weight:700}
.passage h4{margin:8px 0 4px;text-align:left}.passage p{margin:0;text-align:left;line-height:1.6;font-size:16px}
.audio-row{display:flex;gap:8px;margin:6px 0}
.sbtn{flex:1;border:0;border-radius:16px;padding:12px;font-size:17px;font-weight:800;background:var(--sky);color:#fff;cursor:pointer}
.sbtn.soft{flex:0 0 auto;background:#e6f1fe;color:#2f6fb5}
.bank{display:flex;flex-wrap:wrap;gap:6px;align-items:center;border:2px dashed #d8cff7;border-radius:14px;padding:8px 10px;margin:8px 0}
.bank span{font-size:13px;color:var(--muted);font-weight:700}.bank b{background:#f3efff;border-radius:10px;padding:4px 10px}
.opts{display:grid;grid-template-columns:1fr;gap:8px;margin:10px 0}
.opts.emoji{grid-template-columns:1fr 1fr}
.optwrap{display:flex;gap:6px}
.opt{flex:1;border:2px solid var(--line);background:#fff;border-radius:16px;padding:13px 12px;font-size:18px;font-weight:700;cursor:pointer;color:var(--ink);transition:transform .1s}
.opt[dir=ltr]{text-align:left}
.opts.emoji .opt{font-size:44px;text-align:center;padding:10px;position:relative}
.opt.ok{border-color:var(--mint);background:#e6f8f2}
.opt.no{border-color:var(--bad);background:#ffecee;animation:shake .35s}
.opt.picked{border-color:var(--violet);background:#f3efff}
.opt .num{position:absolute;top:4px;right:8px;font-size:18px;font-weight:800;color:var(--violet)}
.opt:disabled{cursor:default;opacity:.85}
.mini{border:0;background:#e6f1fe;border-radius:14px;padding:0 12px;font-size:18px;cursor:pointer}
@keyframes shake{25%{transform:translateX(-5px)}75%{transform:translateX(5px)}}
.typebox{display:flex;gap:8px;margin:10px 0}
.typebox input{flex:1;min-width:0;font-size:20px;padding:12px;border-radius:14px;border:2px solid var(--line);text-align:left}
.typebox input.ok{border-color:var(--mint);background:#e6f8f2}.typebox input.no{border-color:var(--bad);animation:shake .35s}
.kb{margin:0}
.pattern{font-size:22px;letter-spacing:2px;text-align:center;margin:6px 0;font-family:monospace}.pattern b{color:var(--mint)}.pattern i{color:#bbb;font-style:normal}
.btn{border:0;border-radius:14px;padding:12px 18px;font-size:16px;font-weight:800;background:var(--violet);color:#fff;cursor:pointer}
.btn.mint{background:var(--mint)}
.btn:disabled{opacity:.5}
.row{display:flex;gap:8px;justify-content:space-between;margin:10px 0}.row.end{justify-content:flex-start}
.fb{min-height:24px;border-radius:14px;padding:0;margin:8px 0;font-size:16px;line-height:1.5}
.fb.bad,.fb.good,.fb.help{padding:10px 12px}
.fb.bad{background:#fff4e6;color:#8a5a12}.fb.good{background:#e6f8f2;color:#1f7a63}.fb.help{background:#f3efff;color:#4b3cb0}
.fb .hint{margin-top:4px;font-size:14px}
.note{color:var(--muted);font-size:13px;line-height:1.5}
.center{text-align:center}.big{font-size:54px}.sum{font-weight:700}
.secrow{display:flex;justify-content:space-between;padding:6px 0;border-bottom:1px solid var(--line);font-size:14px}
.fstim{text-align:left;font-weight:600;margin-top:2px}.fstim[dir=rtl]{text-align:right}
.panel.help ul{margin:0;padding-inline-start:18px}.panel.help li{margin:6px 0;line-height:1.4}.tp{font-size:12px;color:var(--muted)}
.wl{display:grid;gap:4px}
.wrow{display:flex;justify-content:space-between;gap:8px;background:#faf7fd;border:0;border-radius:10px;padding:8px 10px;font-size:15px;cursor:pointer;color:var(--ink)}
.wrow span:first-child{font-weight:700}
.star{font-size:20px}
</style>
</head>
<body>
<a class="limudim-back" href="../">← הלימודים של אמיליה</a>

<div id="home">
  <div class="hero"><span class="flag">🔤</span><div><h1>אנגלית של אמיליה</h1><p class="sub" id="cd"></p></div></div>
  <div class="meta"><span dir="ltr">Unit 1 · Hey! Friends</span><span><span id="stars"></span> <span id="sync"></span></span></div>
  <div id="resumeBox"></div>
  <div class="big-btns">
    <button class="act violet" id="btnSmart" type="button"><b>🎯 תרגול חכם</b><p id="smartNote">מה שקשה לך יותר – יופיע יותר</p></button>
    <button class="act pink" id="btnMock" type="button"><b>📝 מבחן לדוגמה</b><p>כל חלקי המבחן, כמו ב־2.12</p></button>
    <button class="act wide" id="btnWords" type="button"><b>📒 דף המילים של הפרק</b><p class="note" style="margin:2px 0 0">לקרוא, לשמוע וללמוד</p></button>
  </div>
  <div id="topics"></div>
</div>

<div id="play" class="hidden">
  <div class="topbar"><h2 id="pTitle"></h2><button class="ghost" id="pBack" type="button">הפסקה</button></div>
  <div class="bar"><i id="pBar"></i></div>
  <div class="count" id="pCount"></div>
  <div id="pBody"></div>
</div>

<div id="words" class="hidden">
  <div class="topbar"><h2>📒 המילים של Unit 1</h2><button class="ghost" id="wBack" type="button">חזרה</button></div>
  <div id="wBody"></div>
</div>

<script src="content.js?v=2026-11-19b"></script>
<script src="eng.js?v=2026-11-19b"></script>
</body>
</html>
